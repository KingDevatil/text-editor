name: Release

on:
  # 手动触发
  workflow_dispatch:

  # 推送 v* 标签时自动触发（如 v0.1.0）
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build
        env:
          CI: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Get latest tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        id: latest_tag
        shell: bash
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-creatordate | head -n 1)
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ steps.latest_tag.outputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          gh release upload "$TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      # 1. Build full installer (offlineInstaller – bundled WebView2 for offline environments)
      - name: Build Windows full installer
        run: npm run tauri-build
        env:
          CI: true

      - name: Rename full installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($exe) {
            $newName = $exe.Name -replace '-setup\.exe$', '-full-setup.exe'
            Rename-Item $exe.FullName -NewName $newName
          }

      - name: Upload Windows full artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-full
          path: src-tauri/target/release/bundle/nsis/*-full-setup.exe
          if-no-files-found: error

      # 2. Build basic installer (downloadBootstrapper – auto-download WebView2 if missing)
      - name: Switch config to basic installer
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json -Depth 10
          $conf.bundle.windows.webviewInstallMode = @{ type = "downloadBootstrapper" }
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Build Windows basic installer
        run: npm run tauri-build
        env:
          CI: true

      - name: Upload Windows basic artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Get latest tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        id: latest_tag
        shell: bash
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-creatordate | head -n 1)
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ steps.latest_tag.outputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*-full-setup.exe src-tauri/target/release/bundle/nsis/*-setup.exe --clobber
